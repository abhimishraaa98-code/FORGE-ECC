name: FORGE CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Generate dependency audit report
        run: npm audit --json > npm-audit.json || true
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-dependency-audit
          path: npm-audit.json
          if-no-files-found: error
          retention-days: 14
      - name: Typecheck
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Pack and install CLI in a clean directory
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/forge-clean-install"
          npm install --prefix "$RUNNER_TEMP/forge-clean-install" "$RUNNER_TEMP"/forge-engineering-workbench-*.tgz
          "$RUNNER_TEMP/forge-clean-install/node_modules/.bin/forge" --version
          "$RUNNER_TEMP/forge-clean-install/node_modules/.bin/forge" --help
          mkdir -p "$RUNNER_TEMP/forge-smoke-project"
          "$RUNNER_TEMP/forge-clean-install/node_modules/.bin/forge" init "$RUNNER_TEMP/forge-smoke-project"
          "$RUNNER_TEMP/forge-clean-install/node_modules/.bin/forge" inspect "$RUNNER_TEMP/forge-smoke-project"
